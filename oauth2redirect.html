    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('初始化页面');
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            // const state = params.get('state');
            if (code) {
                const response = await fetch('https://oauth2.googleapis.com/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        code: code,
                        client_id: '549484704507-t37fmo0vpr921sj93v6dlltajpmm6kem',
                        client_secret: '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',
                        redirect_uri: 'https://www.sinobiz.biz/oauth2redirect.html', // 或你的中转 URL
                        grant_type: 'authorization_code'
                    })
                });
                const tokenData = await response.json();
                alert(JSON.stringify(tokenData, null, 2))
            }
            
        })
        
    </script>
